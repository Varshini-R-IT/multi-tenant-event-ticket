services:
  # Express Backend Web Service
  - type: web
    name: multi-tenant-event-ticket-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: event-ticket-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Database on Render
  - name: event-ticket-postgres
    databaseName: event_reservations
    user: postgres_admin
    plan: free
