services:
  # Express Backend Web Service
  - type: web
    name: multi-tenant-event-ticket-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # DATABASE_URL is intentionally omitted here so the backend falls back
      # to the built-in SQLite (sql.js WASM) engine — zero-config, no extra services needed.
      # To use PostgreSQL, add DATABASE_URL as a custom env var pointing to your DB.
